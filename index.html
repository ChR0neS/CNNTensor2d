<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación de Convolución 2D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        .container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .matrix-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid {
            display: grid;
            gap: 4px;
            background-color: #ddd;
            padding: 4px;
            border-radius: 8px;
        }
        .cell {
            width: 40px;
            height: 40px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        /* Tamaños de las cuadrículas */
        .grid-5x5 { grid-template-columns: repeat(5, 1fr); }
        .grid-3x3 { grid-template-columns: repeat(3, 1fr); }
        
        /* Resaltados */
        .highlight-input { background-color: #ffeaa7; }
        .highlight-kernel { background-color: #74b9ff; color: white;}
        .highlight-output { background-color: #55efc4; }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #0984e3;
            color: white;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #074b83; }
        button:disabled { background-color: #b2bec3; cursor: not-allowed; }
        
        .formula-box {
            margin-top: 30px;
            padding: 15px;
            background-color: white;
            border-left: 5px solid #0984e3;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-family: monospace;
            font-size: 1.2em;
            min-width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Operación de Convolución (Correlación Cruzada)</h1>
    <p>Tensor de Entrada (5x5) * Filtro (3x3) = Mapa de Características (3x3)</p>

    <div class="container">
        <div class="matrix-container">
            <h3>Tensor de Entrada ($I$)</h3>
            <div id="input-grid" class="grid grid-5x5"></div>
        </div>

        <div class="matrix-container">
            <h3>Filtro ($K$)</h3>
            <div id="kernel-grid" class="grid grid-3x3"></div>
        </div>

        <div class="matrix-container">
            <h3>Salida ($S$)</h3>
            <div id="output-grid" class="grid grid-3x3"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-prev" onclick="prevStep()" disabled>Paso Anterior</button>
        <button id="btn-next" onclick="nextStep()">Siguiente Paso</button>
    </div>

    <div class="formula-box" id="formula-display">
        Haz clic en "Siguiente Paso" para comenzar el cálculo.
    </div>

    <script>
        // Datos iniciales
        const inputData = [
            [2, 1, 0, 2, 1],
            [0, 1, 2, 1, 0],
            [1, 0, 1, 2, 1],
            [2, 1, 0, 0, 1],
            [1, 1, 2, 1, 0]
        ];

        const kernelData = [
            [1, 0, -1],
            [1, 0, -1],
            [1, 0, -1]
        ];

        let outputData = Array(3).fill().map(() => Array(3).fill(0));
        let currentStep = -1; // -1 significa estado inicial sin calcular
        const maxSteps = 9; // Para una salida de 3x3, hay 9 posiciones

        // Funciones de renderizado
        function createGrid(containerId, data, isOutput = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            data.forEach((row, i) => {
                row.forEach((val, j) => {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.id = `${containerId}-${i}-${j}`;
                    // Si es salida y aún no se calcula, mostrar vacío
                    div.innerText = (isOutput && val === 0 && currentStep === -1) ? '' : val;
                    container.appendChild(div);
                });
            });
        }

        function init() {
            createGrid('input-grid', inputData);
            createGrid('kernel-grid', kernelData);
            createGrid('output-grid', outputData, true);
            updateVisuals();
        }

        // Lógica de pasos
        function nextStep() {
            if (currentStep < maxSteps - 1) {
                currentStep++;
                calculateCurrentStep();
                updateVisuals();
            }
        }

        function prevStep() {
            if (currentStep >= 0) {
                // Borrar el valor actual de la salida si retrocedemos
                const outRow = Math.floor(currentStep / 3);
                const outCol = currentStep % 3;
                outputData[outRow][outCol] = 0; 
                
                currentStep--;
                updateVisuals();
            }
        }

        function calculateCurrentStep() {
            if (currentStep === -1) return;
            const outRow = Math.floor(currentStep / 3);
            const outCol = currentStep % 3;
            
            let sum = 0;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    sum += inputData[outRow + i][outCol + j] * kernelData[i][j];
                }
            }
            outputData[outRow][outCol] = sum;
        }

        function updateVisuals() {
            // Actualizar botones
            document.getElementById('btn-prev').disabled = currentStep === -1;
            document.getElementById('btn-next').disabled = currentStep === maxSteps - 1;

            // Limpiar resaltados
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('highlight-input', 'highlight-kernel', 'highlight-output');
            });

            // Re-renderizar salida para mostrar números actualizados
            createGrid('output-grid', outputData, true);

            if (currentStep === -1) {
                document.getElementById('formula-display').innerText = 'Haz clic en "Siguiente Paso" para comenzar el cálculo.';
                return;
            }

            const outRow = Math.floor(currentStep / 3);
            const outCol = currentStep % 3;
            let formulaText = `S(${outRow},${outCol}) = `;
            let sum = 0;

            // Resaltar Kernel completo siempre durante el cálculo
            for(let r=0; r<3; r++){
                for(let c=0; c<3; c++){
                    document.getElementById(`kernel-grid-${r}-${c}`).classList.add('highlight-kernel');
                }
            }

            // Resaltar Entrada y construir fórmula
            let terms = [];
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const inR = outRow + i;
                    const inC = outCol + j;
                    document.getElementById(`input-grid-${inR}-${inC}`).classList.add('highlight-input');
                    
                    const valIn = inputData[inR][inC];
                    const valKer = kernelData[i][j];
                    terms.push(`(${valIn}×${valKer})`);
                }
            }
            
            // Resaltar Salida
            document.getElementById(`output-grid-${outRow}-${outCol}`).classList.add('highlight-output');
            
            formulaText += terms.join(' + ') + ` = ${outputData[outRow][outCol]}`;
            document.getElementById('formula-display').innerText = formulaText;
        }

        // Iniciar
        init();
    </script>
</body>
</html>
